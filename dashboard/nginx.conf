# AgentPredict dashboard — production nginx site.
#
# Serves the static Vite build and proxies the data plane to the gateway
# container, so the browser only ever talks to ONE origin:
#   /            → static SPA
#   /ws          → gateway WebSocket (upgrade headers required)
#   /health      → gateway health (also handy for external uptime checks)
#
# TLS terminates in FRONT of this (host nginx/Caddy/Traefik or the cloud LB
# for agentpredictufc.com) — this server only speaks plain HTTP on :80.

# The gateway address is resolved at container start on the compose network.
upstream gateway {
    server gateway:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable fingerprinted assets — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Odds can be quiet between polls — don't reap idle-but-healthy sockets.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
    }
}
